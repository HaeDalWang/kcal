<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1A1D24"/>
      <stop offset="1" stop-color="#0D0F13"/>
    </linearGradient>
    <linearGradient id="flame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#FFC75A"/>
      <stop offset="0.55" stop-color="#FF7A3D"/>
      <stop offset="1" stop-color="#FF3D6E"/>
    </linearGradient>
    <clipPath id="fc"><path d="M256 70
           C 300 146, 388 196, 388 314
           C 388 392, 328 446, 256 446
           C 184 446, 124 392, 124 314
           C 124 244, 168 204, 196 154
           C 204 204, 224 230, 248 240
           C 240 184, 236 126, 256 70 Z"/></clipPath>
    <!-- macOS 아이콘 격자: 1024 캔버스에 824 몸체(여기선 512에 412), 아래로 약한 그림자 -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="translate(50 50) scale(0.8047)">
  <rect width="512" height="512" rx="115" fill="url(#bg)" filter="url(#shadow)"/>
  <!-- flame -->
  <path d="M256 70
           C 300 146, 388 196, 388 314
           C 388 392, 328 446, 256 446
           C 184 446, 124 392, 124 314
           C 124 244, 168 204, 196 154
           C 204 204, 224 230, 248 240
           C 240 184, 236 126, 256 70 Z"
        fill="url(#flame)"/>
  <!-- heartbeat line cut through the flame -->
  <polyline clip-path="url(#fc)" points="96,334 196,334 222,286 254,386 282,300 300,334 416,334"
            fill="none" stroke="#12151B" stroke-width="22"
            stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
