name: Release

# macOS universal·Windows x64 빌드를 GitHub Release 초안에 올린다. 게시는 사람이 한다.
# 서명·공증 없음(ad-hoc 서명만): docs/decisions/0020-unsigned-macos-release.md
# 비용: Linux 대비 macOS runner는 10배, Windows는 2배로 분을 차감한다. 태그 push·수동 실행 때만 돈다.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    runs-on: macos-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    # GH_TOKEN(contents: write) only on the steps that call gh, not on install/build steps.
    steps:
      # 서드파티 action은 ci.yml과 같은 commit SHA로 고정한다(공급망). 주석의 태그는 참고용.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # keep the token out of .git/config during build
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (package.json packageManager 사용)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # 빌드 전에 확인한다(macOS 분이 비싸다): 태그 = v<tauri.conf.json version>, 그 태그의 릴리스가 아직 없음.
      - name: Resolve tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./src-tauri/tauri.conf.json').version")
          if [ "$EVENT_NAME" = "push" ]; then tag="$REF_NAME"; else tag="v$version"; fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag does not match tauri.conf.json version v$version"
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            # 수동 실행 초안을 게시하면 태그가 생겨 이 push가 다시 돈다. 그때는 건너뛴다.
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::notice::release $tag already exists; skipping build"
              exit 0
            fi
            echo "::error::release $tag already exists"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile
        if: steps.tag.outputs.tag != ''
      - run: pnpm tauri build --target universal-apple-darwin --bundles app,dmg
        if: steps.tag.outputs.tag != ''

      # 이름을 버전 없이 고정한다: install.sh가 releases/latest/download/<이름>으로 받는다.
      - name: Package
        if: steps.tag.outputs.tag != ''
        run: |
          bundle=src-tauri/target/universal-apple-darwin/release/bundle
          mkdir -p out
          tar --no-xattrs -czf out/kcal-macos-universal.tar.gz -C "$bundle/macos" kcal.app
          cp "$bundle"/dmg/kcal_*_universal.dmg out/kcal-macos-universal.dmg
          cd out
          for f in kcal-macos-universal.tar.gz kcal-macos-universal.dmg; do
            shasum -a 256 "$f" > "$f.sha256"
          done
          cat ./*.sha256

      # 수동 실행이라 태그가 아직 없으면, 초안을 게시할 때 이 commit에 태그가 생긴다.
      - name: Create draft release
        if: steps.tag.outputs.tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # 버전별 릴리스 노트가 있으면 그것을, 없으면 자동 생성 노트를 쓴다.
          notes="docs/release-notes/$TAG.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          gh release create "$TAG" --draft "$@" --target "$GITHUB_SHA" \
            out/kcal-macos-universal.tar.gz out/kcal-macos-universal.tar.gz.sha256 \
            out/kcal-macos-universal.dmg out/kcal-macos-universal.dmg.sha256

  windows:
    runs-on: windows-latest
    needs: macos # macos가 만든 초안 하나에만 업로드한다.
    if: needs.macos.outputs.tag != ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --target x86_64-pc-windows-msvc --bundles nsis
      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installers = @(Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe)
          if ($installers.Count -ne 1) { throw "Expected exactly one NSIS installer" }
          New-Item -ItemType Directory -Path out -Force | Out-Null
          $name = 'kcal-windows-x64-setup.exe'
          Copy-Item $installers[0].FullName "out/$name"
          $hash = (Get-FileHash "out/$name" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "out/$name.sha256" -Value "$hash  $name" -Encoding ascii
      - name: Upload to draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.macos.outputs.tag }}
        run: |
          gh release upload "$TAG" out/kcal-windows-x64-setup.exe out/kcal-windows-x64-setup.exe.sha256
