name: CI

# 비용: GitHub 호스트 runner는 Linux 대비 Windows 2배, macOS 10배로 분을 차감한다.
# main push는 로컬(macOS)에서 검증할 수 없는 Windows만, PR·수동 실행은 두 OS 모두 돌린다.
# 문서만 바뀐 push/PR은 건너뛴다.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'push' && '["windows-latest"]' || '["macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      # 서드파티 action은 commit SHA로 고정한다(공급망). 주석의 태그는 참고용.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (package.json packageManager 사용)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm tauri:build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle-${{ matrix.os }}
          path: src-tauri/target/release/bundle/
          retention-days: 7
